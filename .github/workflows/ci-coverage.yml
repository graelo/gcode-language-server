# Code coverage: unconditional on main, on-demand via workflow_dispatch.
#
# On-demand for a PR branch:
#   gh workflow run "CI: Coverage" --ref <branch>
#
# Local:
#   act push -W .github/workflows/ci-coverage.yml

name: 'CI: Coverage'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Run coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache: false

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-tarpaulin@0.35.4

      - name: Generate coverage report
        run: cargo tarpaulin --locked --verbose --timeout 120 --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cobertura.xml
          fail_ci_if_error: false
