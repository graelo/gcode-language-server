[package]
name = "gcode-language-server"
version = "0.0.2"
edition = "2024"
rust-version = "1.95.0"
description = "A Language Server Protocol implementation for G-code files."
documentation = "https://docs.rs/gcode-language-server"
readme = "README.md"
repository = "https://github.com/graelo/gcode-language-server"
license = "MIT OR Apache-2.0"
keywords = ["gcode", "language-server", "lsp", "rust"]
categories = ["development-tools"]

[[bin]]
name = "gcode-ls"
path = "src/bin/gcode-ls.rs"

[[bench]]
harness = false
name = "parsing_benchmarks"

[[bench]]
harness = false
name = "lsp_benchmarks"

[[bench]]
harness = false
name = "validation_benchmarks"

[dependencies]
anyhow = "1"
clap = { version = "4.0", features = ["derive"] }
dirs = "7"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-std", "macros", "rt", "rt-multi-thread", "time"] }
toml = "1.1"
tower-lsp-server = "0.23"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.0"
